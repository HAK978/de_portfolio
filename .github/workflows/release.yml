name: Release APK

# Builds and signs the Flutter release APK when a `v*` tag is pushed,
# then attaches the APK to the GitHub Release for that tag.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64    — base64 of your release keystore (.jks)
#   KEYSTORE_PASSWORD  — keystore password
#   KEY_ALIAS          — key alias inside the keystore
#   KEY_PASSWORD       — key password

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.2'
          channel: stable
          cache: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Without the keystore, Gradle falls back to debug signing, and
          # phones refuse to install that over the real release.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - run: flutter pub get

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
