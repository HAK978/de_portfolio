name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions-typecheck:
    name: Cloud Functions tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  firebase-emulator:
    name: Firestore rules + login flow (emulators)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21' # the Firestore emulator runs on the JVM
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm install --global firebase-tools@15
      - run: npm run test:emulator

  storage-service:
    name: storage-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22' # matches the VM
          cache: npm
          cache-dependency-path: storage-service/package-lock.json
      - run: npm ci
      - run: node --check index.js
      - run: npm test
